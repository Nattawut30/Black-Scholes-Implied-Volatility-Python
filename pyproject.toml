[tool.poetry]
name = "black-scholes-implied-volatility-python"
version = "1.0.0"
description = "Black-Scholes Options Pricing and Implied Volatility Analyzer"
authors = ["Nattawut Boonnoon <nattawut.boonnoon@hotmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
streamlit = "1.35.0"
numpy = "1.26.4"
scipy = "1.12.0"
pandas = "2.2.2"
plotly = "^5.19.0"
yfinance = "0.2.40"
altair = "^5.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
mypy = "^2.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
