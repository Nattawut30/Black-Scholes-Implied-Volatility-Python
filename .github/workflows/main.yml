name: Python Project CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # เปิดปุ่มให้กดสั่งรันแมนนวลบนเว็บได้ด้วย

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # 👈 แก้จาก '3.10' เป็น '3.11' เพื่อรองรับ types-pandas
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest mypy numpy scipy pandas streamlit plotly yfinance types-pandas

    - name: Run Static Type Check (Mypy)
      run: |
        mypy src/ tests/ --ignore-missing-imports --python-version 3.11 # 👈 ปรับตรงนี้ให้ตรงกัน

    - name: Run Test Suite (Pytest)
      run: |
        PYTHONPATH=. pytest tests/
