name: Python Project CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest mypy numpy scipy pandas streamlit plotly yfinance

    - name: Run Static Type Check (Mypy)
      run: |
        mypy pricing_model.py --ignore-missing-imports

    - name: Run Test Suite (Pytest)
      run: |
        pytest test_pricing_model.py
