name: Python Project CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest mypy numpy scipy pandas streamlit plotly yfinance

    - name: Run Static Type Check (Mypy)
      run: |
        mypy src/ --ignore-missing-imports --python-version 3.11

    - name: Run Test Suite (Pytest)
      run: |
        PYTHONPATH=. pytest tests/
