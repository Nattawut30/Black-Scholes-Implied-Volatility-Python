name: Streamlit Heartbeat Service

on:
  schedule:
    - cron: '17 */8 * * *'  # รันทุก 8 ชั่วโมง; หลบช่วงต้นชั่วโมงที่ GitHub อาจหน่วง
  workflow_dispatch:        # กดรันเองจากหน้า GitHub ได้ด้วย

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Wake app with a real browser session
        run: |
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              const browser = await chromium.launch();
              const page = await browser.newPage();
              console.log('Opening app...');
              await page.goto('https://nattawut-blsm.streamlit.app', { waitUntil: 'load', timeout: 60000 });

              const wakeButton = page.getByText('Yes, get this app back up!');
              const isSleeping = await wakeButton.isVisible({ timeout: 5000 }).catch(() => false);

              if (isSleeping) {
                console.log('App is asleep - clicking wake button...');
                await wakeButton.click();
                console.log('Clicked. Waiting for app to boot (this can take 30-60s)...');
                await page.waitForTimeout(45000);
              } else {
                console.log('App is already awake - holding session for 15s...');
                await page.waitForTimeout(15000);
              }

              await browser.close();
              console.log('Done.');
            })();
          "
