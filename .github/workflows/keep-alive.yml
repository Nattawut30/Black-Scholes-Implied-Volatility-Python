name: Streamlit Heartbeat Service

on:
  schedule:
    - cron: '17 */6 * * *'  # รันทุก 6 ชั่วโมง; หลบช่วงต้นชั่วโมงที่ GitHub อาจหน่วง
  workflow_dispatch:        # กดรันเองจากหน้า GitHub ได้ด้วย

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Wake app with a real browser session
        run: |
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              const browser = await chromium.launch();
              const page = await browser.newPage();
              console.log('Opening app...');
              await page.goto('https://nattawut-blsm.streamlit.app', { waitUntil: 'networkidle', timeout: 60000 });
              console.log('Page loaded, holding session for 15s...');
              await page.waitForTimeout(15000);
              await browser.close();
              console.log('Done.');
            })();
          "
