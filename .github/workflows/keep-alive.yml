name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'   # รันทุก 6 ชั่วโมง (ปลอดภัยกว่าเกณฑ์ 12 ชม. ของ Streamlit เยอะ)
  workflow_dispatch:        # กดรันเองจากหน้า GitHub ได้ด้วย

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app to keep it awake
        run: curl -sL --max-time 30 https://nattawut-black-scholes.streamlit.app > /dev/null
