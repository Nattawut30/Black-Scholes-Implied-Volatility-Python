[tool.poetry]
name = "black-scholes-implied-volatility-python"
version = "1.0.0"
description = "Black-Scholes Options Pricing and Implied Volatility Analyzer"
authors = ["Nattawut Boonnoon <nattawut.boonnoon@hotmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
streamlit = "^1.59.1"
numpy = "^1.26.4"
scipy = "^1.12.0"
pandas = "^2.2.1"
plotly = "^5.19.0"
yfinance = "^1.5.1"
altair = "^5.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
mypy = "^2.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
